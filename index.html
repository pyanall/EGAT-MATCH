/* ถ้าเนื้อหายาวเกิน 1 หน้า ลดขนาดตัวอักษรทีละน้อย (ต่ำสุด 9pt) */
function shrinkToFit(){ const p=$('paper'); if(!p) return; let fs=10.5; p.classList.remove('tight'); p.style.setProperty('--fs',fs+'pt'); const z=p.style.zoom; p.style.zoom=1;
  const over=()=>p.scrollHeight>p.clientHeight+1;
  while(over() && fs>9){ fs-=.25; p.style.setProperty('--fs',fs+'pt'); }
  if(over()){ p.classList.add('tight'); fs=9.5; p.style.setProperty('--fs',fs+'pt');      // เนื้อหาเยอะ (เช่น 3 แพ็กเกจ + บิล 6 เดือน): ลดระยะห่าง
    while(over() && fs>8.5){ fs-=.25; p.style.setProperty('--fs',fs+'pt'); } }
  p.style.zoom=z; }
function fitPaper(){ const p=$('paper'); if(!p) return; const w=$('report').clientWidth-24, s=Math.min(1,w/794); p.style.zoom=s; }
function openReport(){
  let r=$('report'); if(!r){ r=document.createElement('div'); r.id='report'; document.body.appendChild(r); }
  r.innerHTML=`<div class="rp-bar"><button id="rpBack" aria-label="แก้ไขข้อมูล">${ic('chev',18,2.4)}<em>แก้ไขข้อมูล</em></button><span>รายงานพร้อมพิมพ์</span><div class="rp-act"><button id="rpHome" class="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/></svg>กลับสู่หน้าแรก</button><button id="rpPrint" class="pri">${ic('down',18,2.2)} พิมพ์ / PDF</button></div></div>${reportHtml()}`;
  document.body.classList.add('rp-open'); r.scrollTop=0; shrinkToFit(); fitPaper(); if(document.fonts) document.fonts.ready.then(()=>{shrinkToFit();fitPaper();});
  $('rpBack').onclick=()=>{document.body.classList.remove('rp-open');};
  $('rpPrint').onclick=()=>window.print();
  $('rpHome').onclick=()=>window.newCustomer();
}
window.addEventListener('resize',fitPaper);

function closeSheet(){ $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); }

/* ---------- in-app numeric keypad (แทนแป้นพิมพ์ของเครื่อง) ---------- */
let KP=null;
function kpRender(){
  const i=KP.input, raw=i.value.replace(/\D/g,''), d=i.dataset;
  const shown=raw?(d.phone?raw:fmt(+raw)):'0';
  $('kp').innerHTML=`<div class="kp-h"><div><small>${d.kp}</small><b>${shown}<i>${d.unit||''}</i></b></div><button class="kp-done" data-k="done">เสร็จ</button></div>
    <div class="kp-err" id="kpErr"></div>
    <div class="kp-g">${['1','2','3','4','5','6','7','8','9',d.phone?'':'000','0','del'].map(k=>k===''?'<span></span>':k==='del'?`<button class="fn" data-k="del" aria-label="ลบ">${ic('chev',22,2.2).replace('m9 6 6 6-6 6','m15 6-6 6 6 6')}</button>`:`<button class="${k==='000'?'fn':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
}
function kpOpen(input){
  if(KP&&KP.input===input) return;
  if(KP) KP.input.classList.remove('kp-on');
  KP={input}; input.classList.add('kp-on'); kpRender();
  $('kp').classList.add('show'); $('kp').setAttribute('aria-hidden','false'); $('body').classList.add('kp-pad'); $('foot').style.visibility='hidden';
  setTimeout(()=>input.closest('.field').scrollIntoView({block:'center',behavior:'smooth'}),60);
}
function kpClose(){ if(!KP) return; KP.input.classList.remove('kp-on'); KP.input.blur(); KP=null;
  $('kp').classList.remove('show'); $('kp').setAttribute('aria-hidden','true'); $('body').classList.remove('kp-pad'); $('foot').style.visibility=''; setTimeout(()=>{ if(!KP) $('kp').innerHTML=''; },300); }
$('kp').addEventListener('pointerdown',e=>e.preventDefault());   // ไม่ให้ช่องกรอกเสีย focus
$('kp').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('[data-k]'); if(!b||!KP) return; const k=b.dataset.k, i=KP.input, d=i.dataset;
  if(k==='done') return kpClose();
  let raw=i.value.replace(/\D/g,'');
  if(k==='del') raw=raw.slice(0,-1);
  else { const next=(raw==='0'&&!d.phone?'':raw)+k; if(next.length>+(d.len||9)){ $('kpErr').textContent='ตัวเลขยาวเกินไป'; return; }
         if(d.limit&&+next>+d.limit){ $('kpErr').textContent=`สูงสุด ${d.limit} ${d.unit}`; return; } raw=next; }
  i.value=raw; i.dispatchEvent(new Event('input',{bubbles:true})); kpRender();
});
const KP_TOUCH=matchMedia('(pointer: coarse)').matches;   // แสดงแป้นตัวเลขเฉพาะจอสัมผัส · คอมพิวเตอร์พิมพ์ด้วยคีย์บอร์ดตามปกติ
document.addEventListener('focusin',e=>{ const t=e.target; if(t.matches&&t.matches('input[data-kp]')){ if(KP_TOUCH) kpOpen(t); else t.setAttribute('inputmode','numeric'); } else if(KP&&!$('kp').contains(t)) kpClose(); });
document.addEventListener('click',e=>{ if(KP&&!e.target.closest('#kp')&&!e.target.closest('input[data-kp]')) kpClose(); });
const _go=go; go=function(n){ kpClose(); _go(n); };

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
$('back').onclick=()=>{ if(S.step>1) go(S.step===5?4:S.step-1); };

(function(){

  const ar=GR+20;
  return `<svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="gfill" x1="0" x2="1"><stop offset="0" stop-color="#FFC400"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient>
    <radialGradient id="gbg" cx=".5" cy=".95" r=".8"><stop offset="0" stop-color="#FFF7DA"/><stop offset=".55" stop-color="#F4F8FF"/><stop offset="1" stop-color="#fff"/></radialGradient></defs>

    <path d="M${GX-ar} ${GY}A${ar} ${ar} 0 0 1 ${GX+ar} ${GY}" fill="none" stroke="#E7EEF8" stroke-width="16" stroke-linecap="round"/>
    <path id="g-fill" d="M${GX-ar} ${GY}A${ar} ${ar} 0 0 1 ${GX+ar} ${GY}" fill="none" stroke="url(#gfill)" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
    ${t}
    <g id="g-needle" style="transform-origin:${GX}px ${GY}px;transform:rotate(-90deg)"><path d="M${GX-7} ${GY}L${GX} ${GY-GR+34}L${GX+7} ${GY}Z" fill="#F06A24"/></g>
    <circle cx="${GX}" cy="${GY}" r="16" fill="#123B80"/><circle cx="${GX}" cy="${GY}" r="6" fill="#FFC400"/>
    <text x="${GX-ar}" y="${GY+38}" font-size="18" fill="#5E6D82" text-anchor="middle" font-family="sans-serif">0%</text>

    <div class="g-cap" id="g-cap"></div>`;
}
function updateGauge(){
  const cap=document.getElementById('g-cap'); if(!cap) return;
  const v=Math.max(0,Math.min(1,onShare()));                       // สัดส่วนหน่วยไฟ On-Peak จาก logic เดิม
  const src=S.billData?`จากบิล ${S.billData.months.length} เดือน`:(S.dayTouched?'ปรับเองแล้ว':'ค่าประมาณจากประเภทธุรกิจ');
  const html=`<small>สัดส่วนการใช้ไฟ<br>ช่วง On-Peak</small><b>${Math.round(v*100)}%</b><span class="${S.billData?'':'est'}">${src}</span>`;
  const n=document.getElementById('g-needle'), f=document.getElementById('g-fill');
  const fresh=n && !n.dataset.init;
  if(!cap.querySelector('.counting') && cap.dataset.h!==html){ cap.dataset.h=html; cap.innerHTML=html; if(fresh) countUp(cap.querySelector('b'),1100); }
  const set=()=>{ if(n) n.style.transform=`rotate(${(-90+v*180).toFixed(1)}deg)`; if(f) f.setAttribute('stroke-dasharray',`${(v*100).toFixed(1)} 100`); };
  if(fresh && !RM.matches){ n.dataset.init=1; n.style.transform='rotate(-90deg)'; if(f) f.setAttribute('stroke-dasharray','0 100');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.classList.add('sweep'); if(f) f.classList.add('sweep'); set(); })); }
  else { if(n) n.dataset.init=1; set(); }
}

function noteList(nt){
  const t=nt.textContent.trim().replace(/\s+/g,' ');
  const body=t.replace(/^ประมาณการเบื้องต้น:\s*/,''), segs=body.split(' · ');
  const rows=[]; let foot='';
  const R=(k,v,s='')=>rows.push(`<li><span class="nk">${k}</span><span class="nv">${v}${s?`<small>${s}</small>`:''}</span></li>`);
  for(const sg of segs){ let m;
    if(m=sg.match(/^ค่าไฟเฉลี่ย\s*(.+)$/)) R('ค่าไฟเฉลี่ย',m[1]);
    else if(m=sg.match(/^อัตรา TOU ([^:]+): On-Peak \((.+?)\) (฿[\d.,]+) \/ Off-Peak \((.+?)\) (฿[\d.,]+)\/หน่วย \+ Ft (฿[\d.,]+) \+ VAT (\d+%)$/)){
      R('On-Peak',m[3]+'/หน่วย',m[2]); R('Off-Peak',m[5]+'/หน่วย',m[4]); R('Ft · VAT','+'+m[6]+'/หน่วย · VAT '+m[7],'อัตรา TOU '+m[1]); }
    else if(m=sg.match(/^Demand\s*(.+)$/)) R('Demand',m[1]);
    else if(m=sg.match(/^โซลาร์: แผง (.+?) ใช้พื้นที่ (.+?) ราคา (฿\S+) \((.+?)\) ผลิตไฟ (.+)$/)) R('โซลาร์',m[3]+' ('+m[4]+')',`แผง ${m[1]} · ${m[2]}/แผง · ผลิตไฟ ${m[5]}`);
    else if(m=sg.match(/^ค่าการปล่อย\s*(.+)$/)) R('คาร์บอน',m[1]);
    else if(/ตรวจวัดหน้างาน/.test(sg)) foot=sg;
    else R('',sg);
  }
  nt.classList.add('note-list');
  nt.innerHTML=`<details class="nt-d" ${S.noteOpen?'open':''}><summary class="nt-h">${ICON_INFO} สมมติฐานที่ใช้ประมาณการเบื้องต้น<i class="nt-chev" aria-hidden="true"></i></summary><ul>${rows.join('')}</ul>${foot?`<p class="nt-f">${foot}</p>`:''}</details>`;
  nt.querySelector('details').addEventListener('toggle',e=>{ S.noteOpen=e.target.open; });
}

function deco(){
  const s=S.step, scr=document.getElementById('screen');
  if(scr.dataset.step!==String(s)) scr.dataset.step=s;
  /* progress: แยก "ผ่านแล้ว" กับ "ขั้นตอนปัจจุบัน" */
  [...document.getElementById('prog').children].forEach((el,i)=>el.classList.toggle('cur',s<=4&&i===s-1));
  /* หัวข้อ: เน้นคำสำคัญ */
  const t=document.getElementById('title');
  if(t && !t.querySelector('em')){
    const parts=t.innerHTML.split('<br>');
    if(parts.length>1){ parts[parts.length-1]=`<em>${parts[parts.length-1]}</em>`; t.innerHTML=parts.join('<br>'); }
    else if(TITLE_HL[s] && t.textContent.includes(TITLE_HL[s])) t.innerHTML=t.textContent.replace(TITLE_HL[s],`<em>${TITLE_HL[s]}</em>`);
  }
  /* คำอธิบายรองของตัวเลือกปัญหา */
  document.querySelectorAll('[data-g] .lb').forEach(lb=>{ if(!lb.querySelector('small')){ const d=GOAL_DESC[lb.parentElement.dataset.g]; if(d) lb.insertAdjacentHTML('beforeend',`<small>${d}</small>`);} });
  /* สถานะเลือกสำหรับ screen reader (ไม่สื่อด้วยสีอย่างเดียว) */
  document.querySelectorAll('[data-g],[data-gr],[data-t],[data-ld],[data-int],[data-al],[data-mode]').forEach(b=>{
    const v=String(b.classList.contains('sel')||b.classList.contains('on')); if(b.getAttribute('aria-pressed')!==v) b.setAttribute('aria-pressed',v); });
  document.querySelectorAll('[data-rec]').forEach(b=>{const v=String(b.parentElement.classList.contains('open')); if(b.getAttribute('aria-expanded')!==v) b.setAttribute('aria-expanded',v);});
  /* hero มาตรวัด */
  const hero=document.querySelector('.hero');
  if(hero){ const g=!!hero.querySelector('#g-cap'); hero.classList.toggle('gauge',g); hero.classList.toggle('photo',!!hero.querySelector(':scope>img')); if(g) updateGauge(); }
  const smp=document.getElementById('sample');
  if(smp && !smp.hasAttribute('role')){ smp.setAttribute('role','button'); smp.tabIndex=0; smp.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();smp.click();} }; }
  /* ตารางบิล: เลื่อนแนวนอนเฉพาะตาราง + หน่วย */
  document.querySelectorAll('table.bt').forEach(tb=>{
    if(!tb.parentElement.classList.contains('tbl-wrap')){ const w=document.createElement('div'); w.className='tbl-wrap'; w.tabIndex=0; w.setAttribute('role','region'); w.setAttribute('aria-label','ตารางบิลค่าไฟ 6 เดือน'); tb.before(w); w.appendChild(tb); }
    const th=tb.querySelectorAll('thead th'), U=['','หน่วย','หน่วย','','บาท'];
    th.forEach((h,i)=>{ if(U[i]&&!h.querySelector('small')) h.insertAdjacentHTML('beforeend',`<small>(${U[i]})</small>`); });
  });
  /* label ให้ช่องกรอกที่ไม่มี <label> */
  document.querySelectorAll('#body input:not([type=checkbox]):not([type=file]),#body select').forEach(el=>{
    if(el.id && document.querySelector(`label[for="${el.id}"]`)) return;
    if(!el.getAttribute('aria-label')){ const l=el.dataset.kp||el.closest('.card')?.querySelector('.lbl')?.childNodes[0]?.textContent?.trim()||el.placeholder; if(l) el.setAttribute('aria-label',l); } });
  document.querySelectorAll('.errmsg').forEach(e=>{ if(!e.hasAttribute('aria-live')) e.setAttribute('aria-live','polite'); });
  /* หน้าผลประเมิน: การ์ดทักทาย + มาสคอต (กิมมิคหน้าเดียว) และป้ายผลเบื้องต้น */
  const top=document.querySelector('.rec-top');
  if(top){
    if(!document.querySelector('.done-hi')){ const n=1+document.querySelectorAll('.rec').length, tp=S.type==='other'?(S.otherText||''):((TYPES[S.group]||[]).find(x=>x[0]===S.type)||[])[1]||'';
      top.insertAdjacentHTML('beforebegin',`<div class="done-hi"><div><b>เจอแนวทางประหยัดแล้ว!</b><small>${n} มาตรการ${tp?'สำหรับ'+tp:''} เรียงจากคุ้มค่าที่สุด</small></div><img src="${BRAND.mascot}" alt="มาสคอต กฟผ. และ College of Innovation จับมือกัน" width="124" height="136"></div>`); }
    if(!top.querySelector('.est-chip')) top.querySelector('.rec-head').insertAdjacentHTML('afterend',`<span class="est-chip">${ICON_INFO} ผลประเมินเบื้องต้น · ตัวเลขจริงขึ้นกับการตรวจวัดหน้างาน</span>`);
  }
  /* การ์ดมาตรการอื่น: ใช้ภาพประกอบชุดเดียวกับการ์ดแนะนำ */
  document.querySelectorAll('.rec').forEach(r=>{ const id=r.querySelector('[data-rec]')?.dataset.rec, ic=r.querySelector('.ic'), k={ee:'pump',solar:'sun',baas:'battery'}[id];
    if(ic && k && !ic.classList.contains('ic-img')){ ic.classList.add('ic-img'); ic.innerHTML=HERO[k](); } });
  /* ปุ่มเติมข้อมูลตัวอย่าง (โรงน้ำแข็ง) มุมขวาก่อนกรอกข้อมูล ทุกหน้าที่มีการกรอก */
  const view=document.querySelector('#body .view');
  if(view && DEMO[s] && !view.querySelector('.demo-row')){
    view.insertAdjacentHTML('afterbegin',`<div class="demo-row"><button type="button" class="demo-btn" id="demoFill" aria-label="ใช้ข้อมูลตัวอย่าง">${ICON_SPARK}<span>ใช้ข้อมูลตัวอย่าง</span></button></div>`);
    document.getElementById('demoFill').onclick=DEMO[s];
  }
  /* หน้า 3: ป้ายกลุ่มธุรกิจชิดซ้าย บรรทัดเดียวกับปุ่มตัวอย่าง */
  const dr=document.querySelector('#body .view>.demo-row'), pc=document.querySelector('#body .view>.center>.pill');
  if(dr && pc){ const c=pc.parentElement; dr.prepend(pc); dr.classList.add('with-pill'); if(!c.children.length) c.remove(); }
  /* หน้าผลประเมิน: หมายเหตุประมาณการ → รายการเป็นข้อ */
  const nt=document.querySelector('#body .note:not(.note-list)'); if(nt) noteList(nt);
  /* แถบค่าไฟ: เหลือ 2 สี (On/Off-Peak) เต็มแถบ */
  document.querySelectorAll('.split:not(.two)').forEach(sp=>{ const seg=[...sp.querySelectorAll('i:not(.dem)')], w=seg.map(i=>parseFloat(i.style.width)||0), t=w.reduce((a,b)=>a+b,0);
    if(t>0) seg.forEach((i,k)=>i.style.width=(w[k]/t*100).toFixed(2)+'%'); sp.querySelectorAll('i.dem').forEach(i=>i.remove()); sp.classList.add('two'); });
  /* ราคาเฉลี่ยจริง ขึ้นบรรทัดใหม่ */
  document.querySelectorAll('.units + .hint:not(.hb), .units ~ .hint:not(.hb)').forEach(h=>{ h.classList.add('hb'); if(h.innerHTML.includes(' · ราคาเฉลี่ยจริง')) h.innerHTML=h.innerHTML.replace(' · ราคาเฉลี่ยจริง','<br><b class="avg">ราคาเฉลี่ยจริง')+'</b>'; });
  /* โลโก้ กฟผ. ในบรรทัดพาร์ตเนอร์ */
  const pt=document.querySelector('.partner'); if(pt && !pt.querySelector('img')) pt.insertAdjacentHTML('afterbegin',`<img src="${BRAND.egat}" alt="EGAT การไฟฟ้าฝ่ายผลิตแห่งประเทศไทย" width="70" height="20">`);
}
/* ---------------- MOTION: แอนิเมชันระดับพรีเมียม (แสดงผลอย่างเดียว) ---------------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
/* ตัวเลขวิ่งขึ้น: ค่าสุดท้ายคือข้อความเดิมทุกตัวอักษร */
function fmtLike(s,e){ const dec=(s.split('.')[1]||'').length, v=parseFloat(s.replace(/,/g,''))*e;
  return s.includes(',')?v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}):v.toFixed(dec); }
function countUp(el,dur=950){
  if(!el||RM.matches||el.dataset.cu) return; el.dataset.cu=1;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), items=[];
  while(w.nextNode()){ const n=w.currentNode, o=n.nodeValue; if(/\d/.test(o)) items.push({n,o,p:o.split(/(\d[\d,]*(?:\.\d+)?)/)}); }
  if(!items.length) return;
  el.classList.add('counting'); const t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    items.forEach(it=>{ it.n.nodeValue=p>=1?it.o:it.p.map((s,i)=>i%2?fmtLike(s,e):s).join(''); });
    if(p<1) requestAnimationFrame(step); else el.classList.remove('counting'); };
  items.forEach(it=>{ it.n.nodeValue=it.p.map((s,i)=>i%2?fmtLike(s,0):s).join(''); });
  requestAnimationFrame(step);
}
/* แถบเลือกแบบเลื่อน (segmented indicator) */
const SEG_POS={};
function segInd(box,key,selSel){
  const btn=box.querySelector(selSel); if(!btn||!btn.offsetWidth) return;
  let ind=box.querySelector(':scope>.seg-ind'), isNew=false;
  if(!ind){ ind=document.createElement('i'); ind.className='seg-ind'; ind.setAttribute('aria-hidden','true'); box.prepend(ind); isNew=true; }
  const to={l:btn.offsetLeft,w:btn.offsetWidth};
  const from=isNew?SEG_POS[key]:null;
  if(from && (from.l!==to.l||from.w!==to.w) && !RM.matches){
    ind.style.transition='none'; ind.style.left=from.l+'px'; ind.style.width=from.w+'px'; void ind.offsetWidth; ind.style.transition='';
  }
  if(ind.style.left!==to.l+'px'||ind.style.width!==to.w+'px'){ ind.style.left=to.l+'px'; ind.style.width=to.w+'px'; }
  if(!box.classList.contains('has-ind')) box.classList.add('has-ind'); SEG_POS[key]=to;
}
let lastStep=null, prevSel=new Set(), prevAlSum='';
const SEL_Q='[data-g],[data-gr],[data-t],[data-ld],[data-int]';
const keyOf=el=>['g','gr','t','ld','int'].map(k=>el.dataset[k]!=null?k+':'+el.dataset[k]:'').join('');
const STAG_Q=':scope>*:not(.grid2):not(.center), :scope>.grid2>*, :scope>.center>*, :scope>.card.form>.ff, :scope>.card.form>.fh';
function motion(){
  const s=S.step, view=document.querySelector('#body .view'), entered=lastStep!==s;
  if(entered){
    lastStep=s;
    /* หัวข้อ + badge เปลี่ยนแบบนุ่ม */
    ['title','sub','steptxt'].forEach(id=>{const e=document.getElementById(id); if(e){e.classList.remove('t-in'); void e.offsetWidth; e.classList.add('t-in');}});
    /* ทยอยเข้า */
    if(view && !RM.matches){
      const hero=document.querySelector('#body>.hero'); const list=[...(hero?[hero]:[]),...view.querySelectorAll(STAG_Q)];
      list.forEach((el,i)=>{ el.style.setProperty('--i',Math.min(i,12)); el.setAttribute('data-st',''); el.addEventListener('animationend',function f(ev){ if(ev.target===el){ el.removeAttribute('data-st'); el.removeEventListener('animationend',f);} }); });
    }
    /* ตัวเลขวิ่ง */
    setTimeout(()=>document.querySelectorAll('.kv dd[style], .pkg-p, .split-l b, .rec .nm small, .bsum b, .al-sum b, .u-row b').forEach((e,i)=>setTimeout(()=>countUp(e),i*35)),220);
    prevSel=new Set([...document.querySelectorAll(SEL_Q)].filter(e=>e.classList.contains('sel')).map(keyOf));
    prevAlSum=document.querySelector('.al-sum b')?.textContent||'';
  } else {
    /* เลือกแล้วเด้ง + เครื่องหมายถูกวาดขึ้น */
    const now=[...document.querySelectorAll(SEL_Q)].filter(e=>e.classList.contains('sel'));
    now.forEach(e=>{ const k=keyOf(e); if(!prevSel.has(k)&&!e.classList.contains('just-sel')){ e.classList.add('just-sel'); e.addEventListener('animationend',function f(ev){ if(ev.target===e){ e.classList.remove('just-sel'); e.removeEventListener('animationend',f);} }); } });
    prevSel=new Set(now.map(keyOf));
    /* ค่าไฟเครื่องจักรเปลี่ยน → ตัวเลขวิ่งจากค่าเดิม */
    const ab=document.querySelector('.al-sum b'); if(ab && !ab.dataset.cu && ab.textContent!==prevAlSum){ prevAlSum=ab.textContent; countUp(ab,600); }
  }
  /* segmented controls */
  document.querySelectorAll('.al-seg').forEach(b=>{ const k=b.querySelector('[data-al]')?.dataset.al; if(k) segInd(b,'al-'+k,'.sel'); });
  document.querySelectorAll('.seg-t').forEach((b,i)=>segInd(b,'mode-'+(b.closest('.rec')?.querySelector('[data-rec]')?.dataset.rec||'top'),'.on'));
  /* อ่านบิล: skeleton → แถวไหลเข้า */
  const busy=document.querySelector('.upl.busy');
  if(busy && !busy.querySelector('.skel')) busy.insertAdjacentHTML('beforeend','<div class="skel" aria-hidden="true">'+'<i></i>'.repeat(5)+'</div>');
  document.querySelectorAll('table.bt:not(.rows-in)').forEach(t=>{ t.classList.add('rows-in'); t.querySelectorAll('tbody tr, tfoot tr').forEach((r,i)=>r.style.setProperty('--r',i)); });
  /* มาสคอต: ประกายเล็ก ๆ */
  const hi=document.querySelector('.done-hi'); if(hi && !hi.querySelector('.spark')) hi.insertAdjacentHTML('beforeend','<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i>');
}
/* ส่วนหัวย่อเมื่อเลื่อน */
(()=>{ const b=document.getElementById('body'), sc=document.getElementById('screen'); let on=false;
  b.addEventListener('scroll',()=>{ const y=b.scrollTop; if(!on&&y>8){on=true;sc.classList.add('scrolled');} else if(on&&y<=8){on=false;sc.classList.remove('scrolled');} },{passive:true}); })();
/* ระลอกน้ำตอนกดปุ่ม */
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('.cta:not(:disabled),.btn2'); if(!b||RM.matches) return;
  const r=b.getBoundingClientRect(), d=Math.max(r.width,r.height)*1.2, s=document.createElement('span');
  s.className='ripple'; s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.classList.add('ripple-host'); b.appendChild(s); setTimeout(()=>s.remove(),650); });

/* Splash: หน้าแรกสุด — กด "เริ่มต้นใช้งาน" → วงหมุน → ขั้นตอนที่ 1 · เรียกกลับมาได้ด้วย window.showSplash() */
(()=>{ const sp=document.getElementById('splash'), st=document.getElementById('spStage'), scr=document.getElementById('screen'); if(!sp) return;
  const go=document.getElementById('spGo'), spin=document.getElementById('spSpin');
  const fit=()=>{ const s=Math.max(sp.clientWidth/390, sp.clientHeight/844); st.style.transform=`translate(-50%,-50%) scale(${s})`; };
  let started=false, done=false;
  const show=()=>{ started=false; done=false;
    go.style.display=''; go.classList.remove('out'); spin.style.display='none';
    sp.style.display=''; sp.classList.remove('out'); scr.classList.add('splashing'); fit(); addEventListener('resize',fit); };
  const leave=()=>{ if(done) return; done=true; removeEventListener('resize',fit);
    sp.classList.add('out'); scr.classList.remove('splashing'); lastStep=null; render();
    setTimeout(()=>{ if(done) sp.style.display='none'; }, RM.matches?0:600); };
  const start=()=>{ if(started) return; started=true; go.classList.add('out');
    setTimeout(()=>{ go.style.display='none'; spin.style.display='block'; }, RM.matches?0:220);
    setTimeout(leave, RM.matches?400:1600); };
  go.addEventListener('click',e=>{ e.stopPropagation(); start(); });
  sp.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); start(); } });
  window.showSplash=show; show();
})();
let queued=false;
new MutationObserver(recs=>{
  if(recs.every(r=>{const t=r.target.nodeType===3?r.target.parentElement:r.target; return t&&t.closest&&t.closest('.counting,.ripple-host');})) return;
  if(queued) return; queued=true; queueMicrotask(()=>{ queued=false; deco(); motion(); }); })
  .observe(document.getElementById('screen'),{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});

/* รายงาน: ใส่โลโก้ กฟผ. ในหัวรายงาน (หลังสร้างรายงานด้วยฟังก์ชันเดิม) */
const _openReport=openReport;
openReport=function(){ _openReport();
  const m=document.querySelector('#paper .mark');
  if(m){ m.outerHTML=`<img class="egat-logo" src="${BRAND.egat}" alt="กฟผ. (EGAT)">`; shrinkToFit(); fitPaper(); }

};
})();

render();
</script>
